<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="bg-grad-electronics" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EBF3FF"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08"/>
    </filter>
  </defs>
  <rect width="300" height="300" rx="20" fill="url(#bg-grad-electronics)"/>
  <g filter="url(#shadow)">
    
        <!-- Smartphone / Device Graphics -->
        <rect x="110" y="55" width="80" height="135" rx="14" fill="#3B82F6" stroke="#1D4ED8" stroke-width="4"/>
        <rect x="118" y="68" width="64" height="100" rx="4" fill="#FFFFFF"/>
        <circle cx="150" cy="178" r="5" fill="#FFFFFF" opacity="0.8"/>
        <!-- Screen Content Lines -->
        <rect x="126" y="80" width="48" height="8" rx="4" fill="#3B82F6" opacity="0.4"/>
        <rect x="126" y="95" width="36" height="6" rx="3" fill="#1D4ED8" opacity="0.6"/>
        <circle cx="150" cy="125" r="16" fill="#3B82F6" opacity="0.3"/>
        <path d="M144 125 L156 125 M150 119 L150 131" stroke="#1D4ED8" stroke-width="3" stroke-linecap="round"/>
    
  </g>
  <g filter="url(#shadow)">
    <rect x="18" y="238" width="264" height="48" rx="24.0" fill="#FFFFFF" fill-opacity="0.95" stroke="#3B82F6" stroke-opacity="0.2" stroke-width="1"/>
    <text x="150" y="259" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">LumaStream 4K</text><text x="150" y="275" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" fill="#1E293B" text-anchor="middle">Streaming Stick</text>
  </g>
</svg>