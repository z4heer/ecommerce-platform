<app-page-container>
    <app-page-header title="Product Catalog" subtitle="Manage and view enterprise inventory items."></app-page-header>

    <section class="controls-section" aria-label="Catalog filters and search">
        <app-search-toolbar [placeholder]="'Search products by name or description...'"
            (searchChange)="onSearch($event)">
        </app-search-toolbar>

        <div class="filter-group">
            <app-section-header title="Filter by Category"></app-section-header>
            <div class="filter-chips" role="radiogroup" aria-label="Product categories">
                <button *ngFor="let category of categories()" type="button" role="radio"
                    [attr.aria-checked]="selectedCategory() === category"
                    [class.active]="selectedCategory() === category" (click)="onCategorySelect(category)"
                    class="filter-chip-btn">
                    {{ category }}
                </button>
            </div>
        </div>
    </section>

    <hr class="section-divider" />

    <!-- Loading View Wrapper -->
    <app-loading-skeleton *ngIf="isLoading()" [variant]="'card'" [count]="6" class="grid-container" aria-live="politely"
        aria-busy="true">
    </app-loading-skeleton>

    <!-- Error View Wrapper -->
    <app-error-state *ngIf="!isLoading() && error()" title="Data Retrieval Error"
        [description]="error()?.message || 'Failed to retrieve product data. Please try again later.'">
    </app-error-state>

    <!-- Content State Grid Frame -->
    <ng-container *ngIf="!isLoading() && !error()">

        <!-- Empty State Fallback -->
        <app-empty-state *ngIf="filteredProducts().length === 0" title="No Products Found"
            description="We couldn't find any items matching your selected criteria or search terms. Try adjusting your filters.">
        </app-empty-state>

        <!-- Active Grid View: Flattened structure to guarantee rendering visibility when elements populate -->
        <div *ngIf="filteredProducts().length > 0" class="grid-container">
            <app-card *ngFor="let product of filteredProducts()" (click)="navigateToDetail(product.id)"
                [attr.aria-label]="product.name + ', ' + product.price + ', ' + (product.status || 'Unknown')">

                <div class="product-card-content">
                    <div class="image-wrapper">
                        <img [src]="product.imageUrl || ''" [alt]="'Image representation of ' + product.name"
                            class="product-image" />
                    </div>

                    <div class="product-details">
                        <span class="product-category">{{ product.category }}</span>
                        <h3 class="product-title">{{ product.name }}</h3>
                        <p class="product-description">{{ product.description }}</p>
                    </div>

                    <div class="product-footer">
                        <span class="product-price">{{ product.price | currency }}</span>
                        <app-status-chip [status]="mapStatusType(product.status)"
                            [label]="resolveStatusLabel(product.status)">
                        </app-status-chip>
                    </div>
                </div>

            </app-card>
        </div>

    </ng-container>
</app-page-container>
