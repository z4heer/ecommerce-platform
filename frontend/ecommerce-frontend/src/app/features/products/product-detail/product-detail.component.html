@if(product){

<mat-card>

    <mat-card-title>
        {{ product.name }}
    </mat-card-title>

    <mat-card-content>

        <p>{{ product.description }}</p>

        <p>
            Category:
            {{ product.category }}
        </p>

        <p>
            Price:
            ₹ {{ product.price }}
        </p>

        <p>
            Stock:
            {{ product.stock_quantity }}
        </p>

    </mat-card-content>

</mat-card>

}
