<div class="reports-container">
  <h2>Executive Operations & Inventory Reports</h2>

  <div class="metrics-grid">
    <mat-card class="metric-card">
      <mat-card-header>
        <mat-icon mat-card-avatar>trending_up</mat-icon>
        <mat-card-title>Total Sales Volume</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <h1 class="metric-value">{{ totalSalesVolume() }}</h1>
        <p class="metric-subtitle">Orders processed this month</p>
      </mat-card-content>
    </mat-card>
  </div>

  <h3 class="table-title">Low-Stock Alerts</h3>
  <table mat-table [dataSource]="lowStockItems()" class="mat-elevation-z8 low-stock-table">

    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef> Product Name </th>
      <td mat-cell *matCellDef="let item"> {{item.name}} </td>
    </ng-container>

    <ng-container matColumnDef="sku">
      <th mat-header-cell *matHeaderCellDef> SKU </th>
      <td mat-cell *matCellDef="let item"> {{item.sku}} </td>
    </ng-container>

    <ng-container matColumnDef="stockQuantity">
      <th mat-header-cell *matHeaderCellDef> Stock Quantity </th>
      <td mat-cell *matCellDef="let item" class="stock-alert">
        {{item.stock_quantity}}
        <mat-icon color="warn" matTooltip="Low Stock Warning">warning</mat-icon>
      </td>
    </ng-container>

    <ng-container matColumnDef="lastUpdated">
      <th mat-header-cell *matHeaderCellDef> Last Updated </th>
      <td mat-cell *matCellDef="let item"> {{item.last_updated | date:'medium'}} </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
  </table>
</div>
