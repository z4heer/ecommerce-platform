<app-page-container>
  <app-page-header title="Enterprise E-Commerce" subtitle="Sign in to continue"></app-page-header>

  <section class="login-page" aria-label="Login">
    <app-card class="login-card" appearance="elevated" ariaLabel="Login form">

      <!-- Loading -->
      <app-loading-skeleton *ngIf="loading()" [variant]="'card'" [count]="1" aria-live="polite" aria-busy="true">
      </app-loading-skeleton>

      <!-- Error -->
      <app-error-state *ngIf="error() && !loading()" title="Login failed" [description]="error() ?? undefined"></app-error-state>

      <!-- Form -->
      <ng-container *ngIf="!loading()">
        <form [formGroup]="loginForm" (ngSubmit)="login()">

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email Address</mat-label>
            <input matInput type="email" formControlName="email" autocomplete="username" aria-required="true">

            <mat-error *ngIf="loginForm.get('email')?.hasError('required') && loginForm.get('email')?.touched">
              Email is required.
            </mat-error>

            <mat-error *ngIf="loginForm.get('email')?.hasError('email') && loginForm.get('email')?.touched">
              Enter a valid email.
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input matInput type="password" formControlName="password" autocomplete="current-password" aria-required="true">

            <mat-error *ngIf="loginForm.get('password')?.hasError('required') && loginForm.get('password')?.touched">
              Password is required.
            </mat-error>

            <mat-error *ngIf="loginForm.get('password')?.hasError('minlength') && loginForm.get('password')?.touched">
              Minimum 6 characters required.
            </mat-error>
          </mat-form-field>

          <button mat-flat-button color="primary" class="login-button" type="submit" [disabled]="loginForm.invalid">
            Login
          </button>
        </form>

        <p class="login-link-text">
          Don't have an account?
          <a routerLink="/register" class="login-link">Register now</a>
        </p>
      </ng-container>

    </app-card>
  </section>
</app-page-container>
