<app-page-container>
  <app-page-header
    title="Create an account"
    subtitle="Register to access the enterprise catalog"
  ></app-page-header>

  <section class="register-page">
    <app-card class="register-card" appearance="elevated" ariaLabel="Register form">
      <!-- Loading -->
      <app-loading-skeleton
        *ngIf="loading()"
        [variant]="'card'"
        [count]="1"
        aria-live="polite"
        aria-busy="true"
      >
      </app-loading-skeleton>

      <!-- Error -->
      <app-error-state
        *ngIf="error() && !loading()"
        title="Registration failed"
        [description]="error() ?? undefined"
      ></app-error-state>

      <!-- Form -->
      <ng-container *ngIf="!loading()">
        <h2>Register</h2>

        <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Email</mat-label>
            <input matInput placeholder="Email" formControlName="email" aria-required="true" />
            <mat-error
              *ngIf="
                registerForm.get('email')?.hasError('required') &&
                registerForm.get('email')?.touched
              "
            >
              Email is required.
            </mat-error>
            <mat-error
              *ngIf="
                registerForm.get('email')?.hasError('email') && registerForm.get('email')?.touched
              "
            >
              Enter a valid email.
            </mat-error>
          </mat-form-field>

          <mat-form-field appearance="outline" class="full-width">
            <mat-label>Password</mat-label>
            <input
              matInput
              type="password"
              placeholder="Password"
              formControlName="password"
              aria-required="true"
            />
            <mat-error
              *ngIf="
                registerForm.get('password')?.hasError('required') &&
                registerForm.get('password')?.touched
              "
            >
              Password is required.
            </mat-error>
          </mat-form-field>

          <button
            mat-raised-button
            color="primary"
            type="submit"
            [disabled]="registerForm.invalid"
            class="register-button"
          >
            Register
          </button>
        </form>
      </ng-container>
    </app-card>
  </section>
</app-page-container>
