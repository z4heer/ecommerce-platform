<app-page-header title="Shopping Cart" [subtitle]="cartService.itemCount() + ' items'">
</app-page-header>

<div class="cart-container">
  @if (cartService.cartItems().length === 0) {
  <app-card>
    <div style="padding: 2rem; text-align: center">
      <p>Your cart is empty.</p>
    </div>
  </app-card>
  } @else {
  <div style="display: flex; flex-direction: column; gap: 1rem; margin-top: 1rem">
    @for (item of cartService.cartItems(); track item.id) {
    <app-card>
      <div style="
              display: flex;
              justify-content: space-between;
              align-items: center;
              padding: 1rem;
            ">
        <div>
          <h3>{{ item.name }}</h3>
          <p>{{ item.price | currency: 'INR' }} x {{ item.quantity }}</p>
        </div>
        <div style="display: flex; gap: 0.5rem">
          <button (click)="cartService.updateQuantity(item.id, item.quantity - 1)">-</button>
          <button (click)="cartService.updateQuantity(item.id, item.quantity + 1)">+</button>
          <button (click)="cartService.removeItem(item.id)" style="color: red">Remove</button>
        </div>
      </div>
    </app-card>
    }

    <app-card>
      <div style="padding: 1rem; text-align: right">
        <h3>Total Price: {{ cartService.totalPrice() | currency: 'INR' }}</h3>
      </div>
    </app-card>
  </div>
  }
</div>
