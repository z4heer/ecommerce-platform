backend-test:
    name: Backend Build & Test (FastAPI)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest # Explicitly installing pytest to fix the 127 error
          pip install -r backend/requirements.txt
          
      - name: Run PyTest
        run: |
          cd backend
          PYTHONPATH=. python -m pytest tests/ # Running as a python module

  frontend-test:
    name: Frontend Build & Test (Angular)
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Updated to fix the deprecation warning
          
      - name: Install Dependencies
        run: |
          cd frontend/ecommerce-frontend
          npm install
          
      # (Keep your build and test steps the same for now)